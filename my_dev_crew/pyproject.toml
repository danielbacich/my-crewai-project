[project]
name = "my_dev_crew"
version = "0.1.0"
description = "A multi-agent local engineering crew, leveraging free AI token sources"
authors = [{ name = "Daniel Bacich" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai>=0.100.0",
    "crewai-tools>=0.30.0",
    "python-dotenv>=1.0.1"
]

[project.scripts]
run_crew = "main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]